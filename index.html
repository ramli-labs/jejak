  set(k, v) { mem[k] = v; try { localStorage.setItem('jejak.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { delete mem[k]; try { localStorage.removeItem('jejak.' + k); } catch (e) {} },
  clearPrefix(p) { Object.keys(mem).forEach(k => k.startsWith(p) && delete mem[k]); try { Object.keys(localStorage).forEach(k => k.startsWith('jejak.' + p) && localStorage.removeItem(k)); } catch (e) {} },
};

async function ambilRoster(kelas, kode) {
  const url = scriptURL(); if (!url) throw new Error('Web belum tersambung ke Google Sheet');

  const j = await res.json(); if (!j.ok) throw new Error(j.pesan || 'gagal');
  store.set('roster.' + kelas, { kode, data: j.data }); return j.data;

async function postPayload(p) {
  const url = scriptURL();
  if (!url) return 'lokal';
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(p) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.pesan || 'gagal');
  return 'terkirim';
}
async function kirim(pn, kg, data) {
  const u = profil();
  const payload = { waktu: new Date().toISOString(), nama: u.nama, kelas: u.kelas, absen: u.absen, kelompok: u.kelompok || '', pertemuan: 'P' + pn, kegiatan: kg.id, judul: kg.judul,
    skor: data.skor ?? '', maks: data.maks ?? '', ringkasan: data.ringkasan || '', jawaban: JSON.stringify(data.jawaban || {}), kode: u.kode || '' };
  if (data.anggota && data.anggota.length) payload.anggota = data.anggota;
  if (data.kelompok) payload.kelompok = data.kelompok;
  const riwayat = store.get('riwayat', []); riwayat.push(payload); store.set('riwayat', riwayat.slice(-200));
  let hasil;
  try { hasil = await postPayload(payload); } catch (e) { const q = store.get('antrean', []); q.push(payload); store.set('antrean', q); hasil = 'antre'; }
  markDone(pn, kg.id, { skor: payload.skor, maks: payload.maks, waktu: payload.waktu });
  store.del(`draft.P${pn}-${kg.id}`);
  renderChips();
  return hasil;
}
async function flushQueue(manual) {
  let q = store.get('antrean', []); if (!q.length || !scriptURL()) { if (manual && !scriptURL()) alertBox('Belum terhubung', 'Web ini belum disambungkan ke Google Sheet (mode coba). Hubungi guru.'); return; }
  const sisa = [];
  for (const p of q) { try { await postPayload(p); } catch (e) { sisa.push(p); } }
  store.set('antrean', sisa); renderChips();
  if (manual) alertBox(sisa.length ? 'Masih ada yang gagal' : 'Berhasil', sisa.length ? `${sisa.length} jawaban belum terkirim. Periksa internet lalu coba lagi.` : 'Semua jawaban sudah terkirim ke guru.');
}

  root.addEventListener('input', e => { const el = e.target; if (!el.name || el.dataset.nodraft !== undefined) return; const cur = store.get('draft.' + key, {}); if (el.type === 'checkbox' || el.type === 'radio') { if (el.type === 'radio') $$(`[name="${el.name}"]`, root).forEach(r => cur[r.name + '::' + r.value] = r.checked); else cur[el.name + '::' + el.value] = el.checked; cur[el.name] = 1; } else cur[el.name] = el.value; store.set('draft.' + key, cur); });

async function cekStatusKelompok(n, kg) {

async function doKirim(root, ctx, data, after) {

function anggotaField() {

}
function ambilAnggota(root) {

    return { isi, skor, zona: z[1].split(' · ')[0].replace('Zona ', '') };
  };
  const t = n => val(root, n + 'x') || val(root, n);
  const preview = () => { const skor = ans.filter(a => a === 1).length; $('[data-preview]', root).innerHTML = `<b>Yang akan dikirim ke guru:</b><br>Skor ${skor}/10 · Jalur ${jalur}<br>Hari ini: ${esc(t('t1') || '–')}<br>Minggu ini: ${esc(t('t2') || '–')}`; };
  root.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b) return; ans[+b.dataset.a] = +b.dataset.v; drawList(); update(); });
  root.addEventListener('change', e => { if (e.target.name === 'jalur') { jalur = e.target.value; drawList(); } preview(); });
  root.addEventListener('input', preview);
  drawList(); update();
  const kb = kirimBar(root, 'Kirim skor & rencana');
  $('[data-kirim]', kb).onclick = () => { const r = update(); if (r.isi < 10) return alertBox('Belum lengkap', 'Isi Ya/Belum untuk semua 10 butir.'); if (!t('t1') || !t('t2')) return alertBox('Belum lengkap', 'Pilih atau tulis tindakan hari ini dan minggu ini.');
    doKirim(root, ctx, { skor: r.skor, maks: 10, ringkasan: `Zona ${r.zona} (${r.skor}/10) · Jalur ${jalur} · Hari ini: ${t('t1')} · Minggu ini: ${t('t2')}`, jawaban: { skor: r.skor, zona: r.zona, jalur, hariIni: t('t1'), mingguIni: t('t2') } }); };
};

R.posttest = (root, ctx) => {
  const Q = ['<b>Nadia</b> hari ini tidak mengunggah apa pun. Ia mencari "sepatu futsal murah", membuka peta menuju lapangan, dan menonton tiga video futsal sampai habis. Analisis jejak apa saja yang ia tinggalkan beserta jenisnya.',
    '<b>Raka</b> mengunggah tiga hal pada minggu yang berbeda: foto berseragam di depan gerbang sekolah, story "les renang tiap Kamis jam 4", dan foto kucing "Mochi, kesayanganku sejak SD". Analisis informasi yang bisa disimpulkan jika ketiganya digabung, dan siapa yang bisa memanfaatkannya.',
    'Hasil audit <b>Dimas</b>: akun publik, lokasi otomatis aktif di foto, bio memuat nama sekolah dan kelas, dan ia tidak pernah memeriksa aplikasi yang terhubung. Evaluasi tingkat risikonya dan tentukan dua tindakan prioritas beserta alasannya.'];
  root.innerHTML = `<div class="inst">Kerjakan sendiri. Jawab dengan kalimatmu sendiri dan sertakan alasan. Guru akan menilai skor 0–4 untuk tiap soal.</div>${Q.map((q, i) => `<div class="q"><b>${i + 1}.</b> ${q}<textarea name="j${i}" style="margin-top:8px;min-height:110px"></textarea></div>`).join('')}`;
  bindDraft(root, ctx.key);
  const kb = kirimBar(root);
  $('[data-kirim]', kb).onclick = () => { const j = [0, 1, 2].map(i => val(root, 'j' + i)); if (j.some(x => !x)) return alertBox('Belum lengkap', 'Jawab ketiga soal dulu.');
    doKirim(root, ctx, { skor: '', maks: 12, ringkasan: j.map((x, i) => `${i + 1}) ${x}`).join(' | '), jawaban: { j } }); };
};

R.tiket = (root, ctx) => {
  root.innerHTML = `<div class="inst">Tiket keluar membantu guru tahu apa yang sudah kamu pahami dan apa yang masih membingungkan.</div>
    <label class="f">3 hal baru yang kupelajari hari ini</label>${[1, 2, 3].map(i => `<input type="text" name="h${i}" style="margin-bottom:6px">`).join('')}
    <label class="f">2 tindakan yang akan kulakukan</label>${[1, 2].map(i => `<input type="text" name="t${i}" style="margin-bottom:6px">`).join('')}
    <label class="f">1 pertanyaan yang masih kupunya</label><input type="text" name="q1">
    <label class="f">Hari ini aku merasa…</label><div class="choice" style="grid-template-columns:repeat(4,1fr)">${['1 · Bingung', '2 · Agak paham', '3 · Paham', '4 · Siap mengajari teman'].map((o, i) => `<label><input type="radio" name="rasa" value="${i + 1}">${o}</label>`).join('')}</div>`;
  bindDraft(root, ctx.key);
  const kb = kirimBar(root);
  $('[data-kirim]', kb).onclick = () => { const h = [1, 2, 3].map(i => val(root, 'h' + i)), t = [1, 2].map(i => val(root, 't' + i)), q = val(root, 'q1'), r = ($('[name=rasa]:checked', root) || {}).value;
    if (h.some(x => !x) || t.some(x => !x) || !q || !r) return alertBox('Belum lengkap', 'Isi semua kolom tiket keluar.');
    doKirim(root, ctx, { skor: +r, maks: 4, ringkasan: `Pemahaman ${r}/4 · Baru: ${h.join('; ')} · Tindakan: ${t.join('; ')} · Tanya: ${q}`, jawaban: { baru: h, tindakan: t, tanya: q, rasa: +r } }); };
};

R.wawancara = (root, ctx) => {
  const Q = ['Pernahkah Anda menyesal setelah mengunggah atau mengirim sesuatu di internet? Apa yang terjadi?', 'Apa yang Anda lakukan sekarang sebelum mengunggah sesuatu?', 'Menurut Anda, unggahan seperti apa yang membuat seseorang dinilai baik oleh orang lain?'];
  root.innerHTML = `<div class="inst">Wawancarai <b>satu anggota keluarga</b> di rumah. Tidak perlu menulis nama mereka. Jawaban ini akan dibaca bersama di Pertemuan 2 (tanpa namamu).</div>
    <label class="f">Yang kuwawancarai</label><select name="siapa"><option value="">Pilih…</option>${['Ayah', 'Ibu', 'Kakak', 'Adik', 'Kakek/Nenek', 'Paman/Bibi', 'Lainnya'].map(o => `<option>${o}</option>`).join('')}</select>
    ${Q.map((q, i) => `<div class="q"><b>${i + 1}.</b> ${esc(q)}<textarea name="w${i}" style="margin-top:8px"></textarea></div>`).join('')}`;
  bindDraft(root, ctx.key);
  const kb = kirimBar(root);
  $('[data-kirim]', kb).onclick = () => { const w = [0, 1, 2].map(i => val(root, 'w' + i)); if (!val(root, 'siapa') || w.some(x => !x)) return alertBox('Belum lengkap', 'Isi semua pertanyaan wawancara.');
    doKirim(root, ctx, { skor: '', maks: '', ringkasan: `(${val(root, 'siapa')}) ${w.map((x, i) => `${i + 1}) ${x}`).join(' | ')}`, jawaban: { siapa: val(root, 'siapa'), w } }); };
};

/* ===================== MODE GURU ===================== */
const KUNCI_GURU_INFO = {
  'P1-pretest': 'Kunci: 1 S, 2 S, 3 B, 4 B. Skor 0–2 → kartu bantuan & audit terpandu; 3–4 → reguler; 4 + uraian tepat → Tantangan Eksplorasi/tutor sebaya.',
  'P1-sortir': 'Aktif: 06.40, 07.30, 10.10, 12.20, 14.30, 15.00, 18.45, 20.00. Pasif: 06.15, 07.05, 09.50, 12.00, 13.15, 16.10, 19.30, 21.30. 15.00 dan 16.10 kartu diskusi (dihitung benar di kolom mana pun). Tercapai KKTP 1: ≥ 13/16.',
  'P1-detektif': 'Tercapai KKTP 2: minimal 4/6 unggahan dihubungkan dengan informasi + risiko, dan ada gambaran gabungan.',
  'P1-algoritma': 'Skor = jumlah video futsal yang dipilih (maks 3) + 1 bila memilih "lama ditonton".',
  'P1-audit': 'Tercapai KKTP 3: zona ditentukan dan dua tindakan spesifik sesuai temuan. Detail butir tidak dikirim (privasi).',
  'P1-posttest': 'Nilai manual 0–4 per butir di kolom Skor Google Sheet. (1) riwayat pencarian, lokasi, lama tontonan = pasif; (2) sekolah + jadwal → keberadaan, nama hewan → pertanyaan keamanan, pihak: orang asing/penipu; (3) zona merah, prioritas geotag & privat/hapus info sekolah. Nilai = jumlah ÷ 12 × 100.',
};
function viewGuru(app) {
  const g = { url: scriptURL(), kunci: store.get('guru.kunci', ''), kelas: store.get('guru.kelas', ''), p: store.get('guru.p', '1'), k: store.get('guru.k', 'sortir') };
  const kegOpts = p => PERTEMUAN[p - 1].kegiatan.filter(k => k.r).map(k => `<option value="${k.id}" ${k.id === g.k ? 'selected' : ''}>${esc(k.judul)}</option>`).join('');
  app.innerHTML = `<div class="crumb"><a href="#">Beranda</a> › Mode guru</div><h1>Mode Guru</h1>
    <div class="grid g2" style="align-items:start"><form class="card" id="fg"><h3 style="margin-top:0">Koneksi Google Sheet</h3>
      <label class="f">URL Web App Apps Script</label><input type="url" id="gUrl" value="${esc(g.url)}" placeholder="https://script.google.com/macros/s/…/exec">
      <label class="f">Kunci guru</label><input type="password" id="gKey" value="${esc(g.kunci)}" placeholder="sesuai KUNCI_GURU di Code.gs">
      <p class="muted" style="font-size:13px">Tersimpan hanya di peramban ini. Murid tetap memakai URL yang ditulis di CONFIG pada file index.html.</p>
      <div class="grid g2"><div><label class="f">Kelas</label><select id="gKelas"><option value="">Semua</option>${KELAS.map(k => `<option ${k === g.kelas ? 'selected' : ''}>${k}</option>`).join('')}</select></div>
      <div><label class="f">Pertemuan</label><select id="gP">${PERTEMUAN.map(p => `<option value="${p.n}" ${String(p.n) === String(g.p) ? 'selected' : ''}>P${p.n} · ${esc(p.judul)}</option>`).join('')}</select></div></div>
      <label class="f">Kegiatan</label><select id="gK">${kegOpts(g.p)}</select>
      <div class="row" style="margin-top:14px"><button class="btn" type="submit">Tampilkan rekap</button><button class="btn ghost" type="button" id="gKode">Kode kelas</button><label class="chk" style="margin:0"><input type="checkbox" id="gPid" ${store.get('guru.pid', false) ? 'checked' : ''}>Tampilan besar (PID)</label></div></form>
    <div class="card"><h3 style="margin-top:0">Kunci &amp; kriteria</h3><div id="gInfo" class="muted"></div><h3>Keadaan web</h3><p style="margin:0">${g.url ? 'Terhubung ke Apps Script.' : '<b>Mode coba</b>: belum ada URL. Rekap di bawah hanya menampilkan kiriman dari perangkat ini.'}</p></div></div>
    <div id="gOut" style="margin-top:18px"></div>`;
  const info = () => $('#gInfo').textContent = KUNCI_GURU_INFO[`P${$('#gP').value}-${$('#gK').value}`] || 'Belum ada kunci untuk kegiatan ini.';
  $('#gP').onchange = () => { $('#gK').innerHTML = kegOpts($('#gP').value); info(); }; $('#gK').onchange = info; info();
  $('#gPid').onchange = e => { store.set('guru.pid', e.target.checked); document.documentElement.classList.toggle('pid', e.target.checked); };
  $('#gKode').onclick = async () => {
    const url = $('#gUrl').value.trim(), kunci = $('#gKey').value, out = $('#gOut');
    if (!url) return alertBox('Belum terhubung', 'Isi URL Apps Script dulu.');
    out.innerHTML = '<p class="muted">Memuat…</p>';
    try { const j = await (await fetch(url + '?' + new URLSearchParams({ aksi: 'kode', kunci }))).json(); if (!j.ok) throw new Error(j.pesan);
      const sel = $('#gKelas').value; const ent = Object.entries(j.data).filter(([k]) => !sel || k === sel);
      out.innerHTML = `<h2>Kode kelas</h2><p class="muted">Tayangkan di PID. Murid memilih kelas, mengetik kode, lalu memilih namanya.</p><div class="grid g3">${ent.map(([k, c]) => `<div class="card" style="text-align:center"><div class="muted" style="font-weight:700">${esc(k)}</div><div class="stat" style="font-size:52px;letter-spacing:6px">${esc(c)}</div></div>`).join('')}</div>`; }
    catch (err) { out.innerHTML = `<div class="note coral"><b>Gagal memuat:</b> ${esc(err.message || 'periksa kunci guru')}.</div>`; }
  };
  $('#fg').onsubmit = async e => { e.preventDefault();
    const url = $('#gUrl').value.trim(), kunci = $('#gKey').value, kelas = $('#gKelas').value, p = $('#gP').value, k = $('#gK').value;
    store.set('guru.url', url); store.set('guru.kunci', kunci); store.set('guru.kelas', kelas); store.set('guru.p', p); store.set('guru.k', k);
    const out = $('#gOut'); out.innerHTML = '<p class="muted">Memuat…</p>';
    let rows, murid = [];
    if (url) { try { const q = new URLSearchParams({ aksi: 'rekap', kunci, kelas, pertemuan: 'P' + p, kegiatan: k }); const res = await fetch(url + '?' + q); const j = await res.json(); if (!j.ok) throw new Error(j.pesan); rows = j.data; murid = j.murid || []; }
      catch (err) { out.innerHTML = `<div class="note coral"><b>Gagal memuat:</b> ${esc(err.message || 'periksa URL, kunci guru, dan koneksi internet')}.</div>`; return; } }
    else rows = store.get('riwayat', []).filter(r => r.pertemuan === 'P' + p && r.kegiatan === k && (!kelas || r.kelas === kelas));
    const last = {}; rows.forEach(r => { last[`${r.kelas}|${r.absen}`] = r; }); rows = Object.values(last).sort((a, b) => (a.kelas + String(a.absen).padStart(2, '0')).localeCompare(b.kelas + String(b.absen).padStart(2, '0')));
    const sk = rows.map(r => parseFloat(r.skor)).filter(x => !isNaN(x)); const maks = rows.find(r => r.maks)?.maks || '';
    const sudah = new Set(rows.map(r => String(r.absen))); const belum = murid.filter(m => !sudah.has(String(m.absen)));
    const zona = k === 'audit' ? ['HIJAU', 'KUNING', 'MERAH'].map(z => [z, rows.filter(r => String(r.ringkasan).includes('Zona ' + z)).length]) : null;
    out.innerHTML = `<div class="grid g3"><div class="card"><div class="stat">${rows.length}</div><div class="muted">murid tercatat${murid.length ? ` dari ${murid.length}` : ''} (kiriman terbaru)</div></div>
      <div class="card"><div class="stat">${sk.length ? (sk.reduce((a, b) => a + b, 0) / sk.length).toFixed(1) : '–'}${maks ? `<span style="font-size:20px">/${esc(maks)}</span>` : ''}</div><div class="muted">rerata skor</div></div>
      ${zona ? `<div class="card">${zona.map(([z, c]) => `<div class="row" style="justify-content:space-between"><b>${z}</b><span class="stat" style="font-size:26px">${c}</span></div>`).join('')}</div>` : ''}</div>
      ${kelas && murid.length ? `<h2>Belum mengerjakan (${belum.length})</h2><div class="card">${belum.length ? belum.map(m => `${esc(m.absen)}. ${esc(m.nama)}`).join(' · ') : '<span class="right">Semua murid sudah tercatat.</span>'}</div>` : (url && !kelas ? '<div class="note">Pilih satu kelas untuk melihat daftar murid yang belum mengerjakan.</div>' : '')}
      <h2>Rincian</h2><div class="tw"><table><thead><tr><th>Kelas</th><th>Absen</th><th>Nama</th><th>Klp</th><th>Skor</th><th>Ringkasan jawaban</th><th>Dikirim oleh</th><th>Waktu</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td>${esc(r.kelas)}</td><td>${esc(r.absen)}</td><td>${esc(r.nama)}</td><td>${esc(r.kelompok)}</td><td>${esc(r.skor)}${r.maks ? '/' + esc(r.maks) : ''}</td><td>${esc(r.ringkasan)}</td><td>${r.oleh && r.oleh !== r.nama ? esc(r.oleh) : ''}</td><td style="white-space:nowrap">${esc(new Date(r.waktu).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' }))}</td></tr>`).join('') || '<tr><td colspan="8" class="muted">Belum ada kiriman.</td></tr>'}</tbody></table></div>`;
  };
}

/* ===================== MULAI ===================== */
render(); flushQueue(false);
</script>
